[package]
name = "reussir-rt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
backtrace = { version = "0.3.75" }
hashbrown = { version = "0.16.0" }
# Fallback allocator when the mimalloc backend is unavailable: the sanitizer
# runtime variants (built `--no-default-features`), miri, and lean embeddings
# like reussir-jit. libc `malloc`/`free`/`realloc` recover the block size from
# the pointer (so the unsized `token<?>` ABI works), the sanitizers *interpose*
# them (so ASan/LSan/MSan actually see the runtime's allocations — mimalloc's
# and dlmalloc's private heaps are invisible to them), and miri shims them.
libc = "0.2"
# `extended` only adds extern declarations (mi_usable_size for the no-copy
# language realloc); the linked C library is the same either way.
libmimalloc-sys = { version = "0.1.44", optional = true, features = ["extended"] }
# The `sync` dialect's futex slow paths (`mlir_sync_*_slow_path`): fully
# lowered lock-guarded cell code calls them, so the runtime carries them for
# every consumer. Keep the rev in lockstep with cmake/MlirSync.cmake's
# GIT_TAG. The crate's `panic-handler` feature stays off — std supplies the
# panic machinery here. The slow paths are plain extern "C" on every
# platform; the backend reaches them through internal preserve_most
# trampolines it generates itself, so there is no ABI contract to keep in
# sync with this build. `nightly` only opts into nightly-gated
# optimizations (e.g. prefetch intrinsics in the combining lock), which is
# fine unconditionally because the workspace pins a nightly toolchain.
mlir_sync = { git = "https://github.com/reussir-lang/mlir-sync.git", rev = "5e9721da4911c5b256a67922193a96e8dd417692", features = ["nightly"] }
num_enum = "0.7.4"
smallvec = "1.15.1"
stacker.workspace = true

[target.'cfg(windows)'.dependencies]
# The last-chance crash reporter (`crash`): SEH exceptions in generated code
# die silently otherwise, and a CI log needs at least the exception code and
# faulting module+offset to locate them.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
] }

[features]
default = ["mimalloc-v2"]
# The language heap requires a size-recovering allocator (`token<?>` frees
# without a size); mimalloc is that allocator today (dlmalloc later). `mimalloc`
# is the version-neutral gate the code checks; select the bundled major through
# one of the versioned features (with --no-default-features). v3 has the
# reworked page management and lower fragmentation; v2 (default) is the stable
# line. Both share the bin geometry that
# include/Reussir/Support/AllocatorBinModel.h models (only a pairing hint).
mimalloc = ["dep:libmimalloc-sys"]
mimalloc-v3 = ["mimalloc", "libmimalloc-sys/v3"]
mimalloc-v2 = ["mimalloc"]

[lib]
crate-type = ["dylib", "lib", "staticlib"]
