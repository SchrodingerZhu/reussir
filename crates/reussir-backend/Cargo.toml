[package]
name = "reussir-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust backend for Reussir: melior-based MLIR access with the Reussir dialect registered"
build = "build.rs"

[lib]
name = "reussir_backend"
# The op builders generated from ODS carry the dialect's TableGen `description`
# text as Rust docs; their fenced code blocks (C++/MLIR snippets) are not Rust
# and must not be run as doctests.
doctest = false

[dependencies]
# `ods-dialects` is required because the op builders generated by melior's
# `dialect!` macro reference `melior::dialect::ods::__private` for their builder
# typestate markers. `helpers` enables melior's higher-level convenience APIs.
melior = { workspace = true, features = ["ods-dialects", "helpers"] }
reussir-backend-sys = { path = "../reussir-backend-sys" }
tracing.workspace = true
