[package]
name = "reussir-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core language representation for Reussir"

[lib]
name = "reussir_core"

[[bin]]
name = "reussir-elab"
path = "src/bin/reussir-elab.rs"

[build-dependencies]
# Generates the textual-IR parser from `src/full/ir.lalrpop` at build time.
lalrpop.workspace = true

[dependencies]
blake3.workspace = true
ena.workspace = true
ftree.workspace = true
lasso.workspace = true
rapidhash.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
stumpalo.workspace = true
# CLI argument parsing for the `reussir-elab` driver.
palc.workspace = true
# Textual-IR round trip: the logos lexer feeds the lalrpop-generated parser.
logos.workspace = true
lalrpop-util.workspace = true
# The surface AST is a set of typed views over the parser's lossless CST.
reussir-syntax = { path = "../reussir-syntax" }
