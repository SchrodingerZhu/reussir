[package]
name = "reussir-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core language representation for Reussir"

[lib]
name = "reussir_core"

[build-dependencies]
# Generates the textual-IR parsers from the `*/grammar.lalrpop` files
# (`full/mir/`, `semi/hir/`) at build time.
lalrpop.workspace = true

[dependencies]
blake3.workspace = true
ena.workspace = true
ftree.workspace = true
lasso.workspace = true
rapidhash.workspace = true
rustc-hash.workspace = true
# fzf-quality fuzzy matcher used to rank the "did you mean" name suggestions
# (frecency-weighted) emitted when a name fails to resolve.
atuin-nucleo-matcher.workspace = true
# Edit-distance metric for the suggester's transposition fallback only.
strsim.workspace = true
smallvec.workspace = true
stumpalo.workspace = true
# Textual-IR round trip: the logos lexer feeds the lalrpop-generated parser;
# pprint is the algebraic (Wadler-style) pretty-printer that emits the IR.
logos.workspace = true
lalrpop-util.workspace = true
pprint.workspace = true
# Arbitrary-precision numeric literals (`literal` module): values stay exact
# through surface/HIR/MIR; the one rounding to the target format is in codegen.
malachite-base.workspace = true
malachite-nz.workspace = true
# The surface AST is a set of typed views over the parser's lossless CST.
reussir-syntax = { path = "../reussir-syntax" }
# The builtin_traits! registration DSL: the trait/impl table in
# semi::traits::builtins is a declaration, not hand-written registration.
reussir-trait-dsl = { path = "../reussir-trait-dsl" }
# Backends for utils::bitset's small-set-optimized VarId live-sets: a dense
# fixedbitset that promotes to a compressed roaring bitmap past 512 bits.
roaring.workspace = true
fixedbitset.workspace = true
