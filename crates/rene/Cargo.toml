[package]
name = "rene"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reussir package manager: builds packages described by a Nickel manifest"
build = "build.rs"

[lib]
name = "rene"

[[bin]]
name = "rene"
path = "src/main.rs"

[dependencies]
# Content hash of the bundled runtime source, the staleness key for the baked
# artifacts recorded in the build-status database.
blake3.workspace = true
# The async runtime: completion-based (io_uring/IOCP), driving the child
# processes (rrc, cargo, rustc) and the source-digest reads. 0.18 pinned:
# 0.19's executor needs a `cfg_select!` newer than the pinned toolchain.
compio = { version = "0.18", features = ["fs", "io", "macros", "process", "time"] }
# `try_join_all` for the concurrent stages (digests, target compiles).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Evaluates the `rene.ncl` manifest; the manifest is a full Nickel program
# (imports, contracts, merging), not a static data file.
nickel-lang.workspace = true
palc.workspace = true
# The version solver (astral's actively maintained fork; its lib target is
# still named `pubgrub`, so imports read naturally), run as a feasibility
# check over the local path-dependency graph (one available version per
# package today).
astral-pubgrub = "0.6"
# The build-status store; its exclusive file lock is also the build-dir lock.
redb.workspace = true
serde.workspace = true
# Re-render the evaluated manifest's JSON export pretty-printed for `build`'s
# config dump, parse `cargo --message-format=json` output, and encode the
# build-status records.
serde_json.workspace = true
# Unpack the bundled runtime source into the build directory.
tar.workspace = true
tracing.workspace = true
# Install a subscriber so `-v`/`RUST_LOG` surface events (to stderr, never
# stdout — stdout carries machine-readable output like the libdir listing).
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd.workspace = true
# The `-j` admission semaphore: process concurrency is bounded separately
# from the pool's worker threads (see `pool`).
async-lock = "3"
indicatif = "0.18.6"
# The `rene new -i` wizard: a stepped terminal UI on stderr (stdout stays
# machine-readable). The crossterm backend is re-exported by ratatui, so the
# event types stay in lockstep.
ratatui.workspace = true
# Draws the Sentinel mark in the wizard through whatever the terminal
# supports (kitty graphics, iTerm2 inline images, sixel), degrading to
# half-block cells everywhere else. No default features: they pull the chafa
# C library (a pkg-config build dependency on every platform) and the full
# image codec set.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
# Decodes the embedded logo PNG for ratatui-image; PNG is the only codec
# compiled in.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Renders `rene new`'s scaffold files from `templates/*.stpl`, compiled in
# at build time so the binary stays self-contained.
sailfish = "0.9"

[build-dependencies]
# Pack the `reussir-rt` source tree (tar + zstd) into the binary, with its
# manifest rewritten standalone (toml_edit resolves workspace inheritance).
tar.workspace = true
toml_edit.workspace = true
zstd.workspace = true

[dev-dependencies]
# Auto-cleaned scratch directories for the manifest loading tests.
tempfile = "3"
# The CLI tests check `rene inspect`'s JSON report, and that the digests it
# records really are Blake3 of the file contents.
blake3.workspace = true
serde_json.workspace = true
