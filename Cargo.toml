[workspace]
resolver = "3"
members = [
    "crates/reussir-rt",
    "crates/reussir-syntax",
    "crates/reussir-lsp",
    "crates/reussir-vscode-wasm",
    "crates/reussir-core",
    "crates/reussir-backend-sys",
    "crates/reussir-backend",
    "crates/reussir-jit",
    "crates/reussir-codegen",
    "crates/reussir-compiler",
    "crates/reussir-repl",
    "crates/rene",
    "crates/reussir-trait-dsl",
]
# The backend crates (and reussir-codegen, which depends on them) link against
# MLIR and the staged Reussir C API, so they are excluded from the default
# `cargo build`; build them explicitly (e.g. `cargo build -p reussir-backend`
# or `cargo build -p reussir-codegen`) with the CMake build wiring up the env.
default-members = [
    "crates/reussir-rt",
    "crates/reussir-syntax",
    "crates/reussir-lsp",
    "crates/reussir-vscode-wasm",
    "crates/reussir-core",
    "crates/rene",
    "crates/reussir-trait-dsl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "(Apache-2.0 OR MIT)"

[workspace.dependencies]
# The builtin_traits! registration DSL (reussir-trait-dsl) parses with syn and
# emits with quote; heck snake_cases trait names into Builtins field names.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
heck = "0.5"
ariadne = "0.5"
blake3 = "1"
rapidhash = "4.4.1"
# Portable, maintained xxh3 hash for the codegen-unit partition: a stable
# symbol→unit assignment that is deterministic across builds and toolchains.
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }
# Fast non-DoS-resistant hasher for interner/compiler-internal maps.
rustc-hash = "2.1"
# Insertion-ordered map; the lowering variable environment relies on its
# stable ordering to recover a nested scope by truncating back to a mark.
indexmap = "2.14"
# Compressed (Roaring) bitmaps over u32; the sparse backend of the ownership
# pass's small-set-optimized VarId live-sets (utils::bitset).
roaring = "0.11.4"
# Dense word-backed bitset; the small-domain backend of utils::bitset before it
# promotes to a Roaring bitmap.
fixedbitset = "0.5.7"
# Small-size-optimized vectors: arity-bounded surface-AST lists (path segments,
# argument/type-parameter lists) stay inline and skip heap allocation.
smallvec = "1.15"
# Fenwick (binary-indexed) tree: O(log n) point-update + prefix-count, used to
# keep the v0 Punycode encoder's per-occurrence "code points placed to the left"
# query sub-linear, so Bootstring encoding is O(n log n) rather than O(n²).
ftree = "1.3.0"
# `multi_threaded_interning` provides the shared (Arc-able) token interner a
# REPL session uses to keep TokenKeys stable across many `parse` calls (see
# `reussir_syntax::parse_with_interner`).
cstree = { version = "0.14", features = ["derive", "lasso_compat", "multi_threaded_interning"] }
# rustc's extracted union-find: keyed unification with value merging and
# snapshot/rollback (the logged path-compression makes speculation correct).
ena = "0.14"
# Bump arena backing the type interner: with_scope yields a generative
# ArenaRef whose `alloc(&self) -> &'scope mut T` hands out arena-lifetimed
# references, so interned `Ty<'tcx>` handles compare by pointer.
stumpalo = { version = "0.4", features = ["std"] }
lasso = "0.7"
# Rust-grammar literal parsing: validates and decodes string/char literal
# escapes (the surface language follows Rust's escape rules).
litrs = "1"
logos = "0.15"
# fzf-quality fuzzy matcher (atuin's fork of helix's nucleo) used to rank
# name-resolution suggestions; pairs with a frecency model built during tyck.
atuin-nucleo-matcher = "0.3"
# Edit-distance metric used only as the fallback inside the suggester (for the
# adjacent-transposition typos nucleo's subsequence match cannot reach).
strsim = "0.11"
# Textual-IR round trip: lalrpop (LR parser generator, build-time) + its runtime
# support deserialize the printed Full/Semi IR; pprint is the algebraic
# (Wadler-style) pretty-printer that emits it.
lalrpop = "0.22"
lalrpop-util = "0.22"
pprint = "0.3"
# Arbitrary-precision integers carrying numeric literals losslessly from the
# surface AST through HIR/MIR; rounding to the target format happens exactly
# once, in codegen. NOTE: LGPL-3.0-only (see the licensing note in LICENSE).
malachite-base = "0.9"
malachite-nz = "0.9"
# llvm-sys provides the ORC/LLJIT and target-machine C API that mlir-sys does
# not bind. Its version tracks LLVM major.minor (23.1 -> 231), and it discovers
# LLVM via LLVM_SYS_231_PREFIX (set by CMake).
llvm-sys = "231"
melior = "0.27"
mlir-sys = "220"
# The stable embedding interface to the Nickel configuration language; `rene`
# evaluates package manifests (`rene.ncl`) with it.
nickel-lang = "2.2"
palc = "0.0.2"
# `rene`'s build-status store (`reussir-build/rene.redb`); its exclusive file
# lock doubles as the cross-process build-directory lock.
redb = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# tar + zstd bundle the `reussir-rt` source tree into the `rene` binary
# (packed by its build script, unpacked into the build directory on demand).
tar = "0.4"
zstd = "0.13"
# Format-preserving TOML editing; `rene`'s build script uses it to resolve the
# bundled runtime manifest's `workspace = true` inheritance into a standalone
# crate manifest.
toml_edit = "0.25"
stacker = "0.1.21"
tracing = "0.1"
# Log-level plumbing for the REPL binary's `-l` flag.
tracing-subscriber = "0.3"
# The language server uses async-lsp's Tower service stack over stdio on the
# multi-threaded runtime. Document contents are synchronized as whole
# snapshots in a concurrent map.
async-lsp = { version = "=0.2.4", default-features = false, features = ["client-monitor", "stdio", "tokio", "tracing"] }
# The wasm client codec builds its payloads from the same LSP type definitions
# async-lsp re-exports to the server; the pin keeps the two in lockstep.
lsp-types = "=0.95.1"
# JS↔wasm glue for the VS Code extension's codec module: wasm-bindgen
# generates the exported class and marshals strings/buffers; the CLI that
# emits the matching JS/TS must match this crate version exactly.
wasm-bindgen = "=0.2.121"
serde-wasm-bindgen = "0.6"
dashmap = "6.2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = "0.5"
# Embedded Rust poly-FFI bodies and MLIR transform schedules are deliberately
# syntax-highlighted without invoking either language's semantic frontend.
tree-sitter-highlight = "=0.26.11"
tree-sitter-rust = "=0.24.2"
tree-sitter-mlir = "=0.1.7"
# Platform data directories for the REPL's persisted history
# (XDG_DATA_HOME/~/.local/share on Linux, %LOCALAPPDATA% on Windows,
# ~/Library/Application Support on macOS).
dirs = "6"
# IEEE 754 half-precision conversion for the REPL's f16 printing (bf16 is a
# two-line manual widening; f16 needs the real rebias/subnormal handling).
half = "2"
libc = "0.2"
# The REPL's interactive terminal UI: ratatui renders it, ratatui-textarea is
# the multiline input editor (smart-Enter submission lives in the REPL).
# `unstable-rendered-line-info` provides `Paragraph::line_count`, which the
# REPL TUI's scrollback pinning needs to count post-wrap visual rows with the
# paragraph's own wrapping rules (hand-computed row counts would drift from
# ratatui's word wrapping).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"

[profile.release]
lto = "thin"

[patch.crates-io]
# Reussir fork: the MSVC fixes for conda-forge LLVM/MLIR (enum alias
# normalization, .lib parsing, static:-bundle) plus the LLVM 23 retarget.
# The crate keeps its 220 version, so melior's `mlir-sys = "220"` resolves to
# it — but its build script checks for 23.x and reads MLIR_SYS_230_PREFIX.
mlir-sys = { git = "https://github.com/reussir-lang/mlir-sys", rev = "5541512807e3feee2ef20897261afd58b0ef859b" }
# Reussir fork of the TableGen bindings melior-macro parses dialects with:
# retargets the llvm22-0 feature to LLVM 23 (version check and
# TABLEGEN_230_PREFIX).
tblgen = { git = "https://github.com/reussir-lang/tblgen-rs", rev = "cd71346c2648b0b5a93a0be902cfbe876ff7ca38" }
# Reussir fork of melior: the LLVM 23 retarget of its pass registrations and
# ods dialect list.
melior = { git = "https://github.com/reussir-lang/melior", rev = "af287e4411a2dc5f9aedb7b1d78f9182f87298c6" }
melior-macro = { git = "https://github.com/reussir-lang/melior", rev = "af287e4411a2dc5f9aedb7b1d78f9182f87298c6" }
