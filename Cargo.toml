[workspace]
resolver = "3"
members = [
    "crates/reussir-rt",
    "crates/reussir-syntax",
    "crates/reussir-core",
    "crates/reussir-backend-sys",
    "crates/reussir-backend",
    "crates/reussir-jit",
]
# The backend crates link against MLIR and the staged Reussir C API, so they are
# excluded from the default `cargo build`; build them explicitly with
# `cargo build -p reussir-backend` (the CMake build wires up the needed env).
default-members = ["crates/reussir-rt", "crates/reussir-syntax", "crates/reussir-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "(Apache-2.0 OR MIT)"

[workspace.dependencies]
ariadne = "0.5"
blake3 = "1"
rapidhash = "4.4.1"
# Fast non-DoS-resistant hasher for interner/compiler-internal maps.
rustc-hash = "2.1"
# Small-size-optimized vectors: arity-bounded surface-AST lists (path segments,
# argument/type-parameter lists) stay inline and skip heap allocation.
smallvec = "1.15"
# Fenwick (binary-indexed) tree: O(log n) point-update + prefix-count, used to
# keep the v0 Punycode encoder's per-occurrence "code points placed to the left"
# query sub-linear, so Bootstring encoding is O(n log n) rather than O(n²).
ftree = "1.3.0"
cstree = { version = "0.14", features = ["derive", "lasso_compat"] }
# rustc's extracted union-find: keyed unification with value merging and
# snapshot/rollback (the logged path-compression makes speculation correct).
ena = "0.14"
# Bump arena backing the type interner: with_scope yields a generative
# ArenaRef whose `alloc(&self) -> &'scope mut T` hands out arena-lifetimed
# references, so interned `Ty<'tcx>` handles compare by pointer.
stumpalo = { version = "0.4", features = ["std"] }
lasso = "0.7"
logos = "0.15"
# Textual-IR round trip: lalrpop (LR parser generator, build-time) + its runtime
# support deserialize the printed Full/Semi IR; pprint is the algebraic
# (Wadler-style) pretty-printer that emits it.
lalrpop = "0.22"
lalrpop-util = "0.22"
pprint = "0.3"
# llvm-sys provides the ORC/LLJIT and target-machine C API that mlir-sys does
# not bind. Its version tracks LLVM major.minor (22.1 -> 221), and it discovers
# LLVM via LLVM_SYS_221_PREFIX (set by CMake).
llvm-sys = "221"
melior = "0.27"
mlir-sys = "220"
palc = "0.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
stacker = "0.1.21"
tracing = "0.1"

[profile.release]
lto = "thin"
