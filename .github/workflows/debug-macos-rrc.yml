name: Debug macOS rrc trap

# Temporary: rrc traps (SIGTRAP) on aarch64-darwin under -O aggressive.
# Build rrc from the cached toolchain and run a failing case under lldb
# for a backtrace. Delete once the crash is fixed. (rerun 3)
on:
  workflow_dispatch:
  push:
    branches: [ ci/s3-caches ]
    paths: [ .github/workflows/debug-macos-rrc.yml ]

permissions:
  contents: read

jobs:
  backtrace:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          sccache-key-prefix: macos-15

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      - name: Build dev shell
        run: nix develop --command true

      - name: Configure CMake
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache \
            cmake --preset nix-dev -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DREUSSIR_ENABLE_PEDANTIC=ON \
            -DREUSSIR_ENABLE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          '

      - name: Build rrc
        run: nix develop --command bash -c 'env RUSTC_WRAPPER=sccache cmake --build build --parallel'

      - name: Reproduce and backtrace
        run: |
          nix develop --command bash -c '
            set -x
            uname -a; sw_vers
            file build/bin/rrc
            RRC=$PWD/build/bin/rrc
            T=$PWD/tests/integration/frontend
            # bare reproduction first (exit code, any stderr)
            "$RRC" "$T/closure_wpd_devirt.rr" --emit llvm-ir -O aggressive -o /tmp/devirt.ll; echo "exit=$?"
            "$RRC" "$T/closure_wpd_devirt.rr" --emit llvm-ir -O default -o /tmp/devirt-default.ll; echo "exit(default)=$?"
            RUST_BACKTRACE=full "$RRC" "$T/array_e2e.rr" -o /tmp/array.o --relocation-mode pic -Oaggressive; echo "exit=$?"
            set +x
            sleep 5
            echo "::group::macOS crash reports"
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head
            for r in $(ls -t ~/Library/Logs/DiagnosticReports/rrc* 2>/dev/null | head -2); do
              echo "== $r"
              python3 - "$r" <<'"'"'PY'"'"'
import json, sys
raw = open(sys.argv[1]).read()
# .ips files: a JSON header line followed by a JSON body
body = json.loads(raw.split("\n", 1)[1])
print("exception:", body.get("exception"))
print("termination:", body.get("termination"))
ft = body.get("faultingThread", 0)
threads = body.get("threads", [])
imgs = body.get("usedImages", [])
t = threads[ft] if ft < len(threads) else threads[0]
for i, fr in enumerate(t.get("frames", [])[:60]):
    img = imgs[fr.get("imageIndex", 0)] if fr.get("imageIndex", 0) < len(imgs) else {}
    print(f"  #{i:2d} {img.get('name','?'):28s} {fr.get('symbol','?')} + {fr.get('imageOffset', fr.get('symbolLocation','?'))}")
PY
            done
            echo "::endgroup::"
            for case in "$T/closure_wpd_devirt.rr --emit llvm-ir -O aggressive -o /tmp/devirt.ll"; do
              echo "::group::lldb backtrace: rrc $case"
              lldb --batch --no-lldbinit --file "$RRC" \
                -o "process launch -- $case" \
                -o "thread backtrace -c 60" \
                -o "register read pc x0 x1 x2 x3" \
                -o "disassemble --pc --count 6" 2>&1 | tail -100
              echo "::endgroup::"
            done
          '
