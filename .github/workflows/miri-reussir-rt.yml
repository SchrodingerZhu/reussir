name: Miri Tests - reussir-rt

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/reussir-rt/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/reussir-rt/**'
  # schedule:
  #   # Run daily at 2 AM UTC
  #   - cron: '0 2 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  miri-test:
    name: Miri Test (reussir-rt)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The Nix daemon gets the shared S3 bucket as a zstd binary cache for
    # what cache.nixos.org does not serve (the fenix Rust toolchain). Without
    # credentials — pull requests from forks — it stays on cache.nixos.org.
    - name: Configure S3 caches
      uses: ./.github/actions/s3-cache
      with:
        access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: ${{ env.NIX_EXTRA_CONF }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Build dev shell
      run: nix develop .#rust --command true

    - name: Push dev shell closure to Nix cache
      if: env.NIX_S3_STORE != ''
      run: scripts/ci/nix-cache-push.sh rust

    # The flake's pinned toolchain carries the miri component
    # (rust-toolchain.toml), so this is the same interpreter every
    # developer gets from `nix develop .#rust`.
    - name: Run Miri tests on reussir-rt
      run: |
        nix develop .#rust --command bash -c '
          cd crates/reussir-rt
          cargo miri test -p reussir-rt
        '
