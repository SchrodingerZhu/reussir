name: Rene Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/rene/**'
      # rene's build script bundles the reussir-rt source tree (and the
      # workspace manifest/lock it rewrites against) into the binary, so
      # changes there change what the tests bake.
      - 'crates/reussir-rt/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rene-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/rene/**'
      - 'crates/reussir-rt/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rene-test.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# rene is a plain Rust crate (no LLVM/MLIR build), so testing it on every
# platform users run it on is cheap. The Linux legs run from the Nix flake's
# lean Rust shell (the same pinned toolchain as `nix develop .#rust`); macOS
# and Windows provision the toolchain with rustup. On Windows the
# fake-toolchain CLI tests sit out (#[cfg(unix)] shell scripts), but the
# crate must build and its unit and locking tests hold there — and the real
# Windows e2e (rene/build.rr, driving the bake and the rrc links with the
# pinned MSVC linker) runs under the MSVC full pipeline, not here.
jobs:
  test-linux:
    name: Test (rene)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # See the sailfish template-lock rationale on the portable job below.
      - name: Clear stale sailfish template locks
        run: find target -path '*sailfish-compiler*/out/templates/*.lock' -delete 2>/dev/null || true

      - name: Warm the sailfish template cache
        run: nix develop .#rust --command cargo clippy -p rene --lib

      - name: Clippy
        run: nix develop .#rust --command cargo clippy -p rene --all-targets -- -D warnings

      # The fast suite: manifest loading, build-dir locking, the clean
      # protocol, and the bake driven through fake cargo/rustc scripts.
      - name: Run tests
        run: nix develop .#rust --command cargo test -p rene

      # The real thing, ignored by default because it is slow and
      # network-dependent: unpack the bundled runtime and bake reussir-rt
      # with the host toolchain (crates.io + the pinned mlir-sync git rev).
      - name: Run host-toolchain bake test
        run: nix develop .#rust --command cargo test -p rene --test cli -- --ignored

  test:
    name: Test (rene)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-03-15
          components: clippy

      # sailfish's derive serializes template compilation on a lock file under
      # `target/`, and a process that loses the race gives up after only
      # 100 * 10ms = 1s, panicking with "Lock file ... is stuck" — which then
      # cascades into a bogus unsatisfied-trait-bound error for the template
      # struct. Two things conspire to blow that budget here:
      #
      #   * `--all-targets` builds rene's lib and its test harness as two
      #     concurrent rustc processes, and both expand the same derive.
      #   * The templates are recompiled on *every* run even with `target/`
      #     restored from cache: sailfish stamps each output back to its
      #     input's mtime, and a fresh checkout stamps the sources newer than
      #     any cached output, so `input_filetime > output_filetime` always
      #     holds.
      #
      # So the winner does the full compile while the loser waits on a
      # one-second fuse. Compiling the templates once, on their own, leaves
      # the parallel pass with nothing to do but a timestamp check.
      #
      # Separately, a build killed while the lock is held leaks the file, and
      # the cache restores it on the next run — at which point nobody is ever
      # going to remove it. Clearing it is safe (pure build state), and has to
      # come first, or the warm-up is what trips over it.
      - name: Clear stale sailfish template locks
        shell: bash
        run: find target -path '*sailfish-compiler*/out/templates/*.lock' -delete 2>/dev/null || true

      - name: Warm the sailfish template cache
        run: cargo clippy -p rene --lib

      - name: Clippy
        run: cargo clippy -p rene --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p rene

      - name: Run host-toolchain bake test
        run: cargo test -p rene --test cli -- --ignored
