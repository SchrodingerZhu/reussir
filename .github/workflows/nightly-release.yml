name: Nightly Release

# Every push to main refreshes the rolling `nightly` prerelease; pushing a
# `v*` tag runs the same build matrix but publishes a versioned release
# under that tag instead (marked latest, nightly untouched).
#
# This pipeline builds and packages only — no tests run here. Correctness
# is gated by the test pipelines (MLIR Backend MultiArch, the macOS and
# Windows full pipelines, Rene Tests, Miri) on every PR and push; a
# release build repeating them doubles the wall-clock for no signal. The
# packaging steps still verify each shipped binary is self-contained and
# starts from a bare environment.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Deliberately NOT built from the Nix flake (unlike the test pipelines):
  # binaries linked inside a nix shell carry a /nix/store ELF interpreter
  # and glibc, which would break the release artifacts' "runs from a bare
  # environment" guarantee. The apt toolchain below links against the
  # runner's stock glibc, which is what end-user machines have.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        llvm-version: [22]
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-03-15
          components: rust-src, rustfmt, clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget libspdlog-dev libgmp-dev

      - name: Install LLVM ${{ matrix.llvm-version }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${{ matrix.llvm-version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # Install LLVM/Clang toolchain. libpolly-*-dev provides the static
          # Polly archives that llvm-config --link-static references (needed by
          # mlir-sys / tblgen / llvm-sys).
          sudo apt-get install -y \
            clang-${{ matrix.llvm-version }} \
            lldb-${{ matrix.llvm-version }} \
            lld-${{ matrix.llvm-version }} \
            clangd-${{ matrix.llvm-version }} \
            libmlir-${{ matrix.llvm-version }}-dev \
            mlir-${{ matrix.llvm-version }}-tools \
            llvm-${{ matrix.llvm-version }}-dev \
            llvm-${{ matrix.llvm-version }}-tools \
            libpolly-${{ matrix.llvm-version }}-dev
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${{ matrix.llvm-version }}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LLVM_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-${{ matrix.llvm-version }}" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ matrix.os }}-${{ matrix.llvm-version }}

      - name: Configure CMake
        run: |
          env RUSTC_WRAPPER=sccache \
          cmake -B build \
          -G Ninja \
          -DLLVM_USE_LINKER=lld \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.llvm-version }} \
          -DCMAKE_C_COMPILER=clang-${{ matrix.llvm-version }} \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DREUSSIR_ENABLE_PEDANTIC=ON \
          -DREUSSIR_ENABLE_TESTS=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm-version }}/lib/cmake/llvm \
          -DMLIR_DIR=/usr/lib/llvm-${{ matrix.llvm-version }}/lib/cmake/mlir

      - name: Build
        run: cmake --build build --parallel

      - name: Stage rrepl
        run: cmake --build build --target rrepl

      - name: Package
        run: |
          ARCH=$(uname -m)
          # Tag builds carry the version; main builds carry the date.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PREFIX="reussir-${GITHUB_REF_NAME}-linux-${ARCH}"
          else
            PREFIX="reussir-nightly-$(date +%Y-%m-%d)-linux-${ARCH}"
          fi
          mkdir -p "${PREFIX}/bin"

          # Only the user-facing toolchain ships: rrc and rrepl link
          # LLVM/MLIR and the Reussir backend statically, while rene and
          # reussir-lsp link no native LLVM code — so there are no shared
          # libraries and no rpath fixups. No Rust toolchain and no prebuilt
          # runtime ship either: rene carries the reussir-rt source bundle and bakes it
          # with the user's own rust/cargo on first use.
          for bin in rrc rene rrepl reussir-lsp; do
            cp -a "build/bin/${bin}" "${PREFIX}/bin/"
          done

          # The statically linked C++ archives are built RelWithDebInfo;
          # drop their debug info.
          strip --strip-debug "${PREFIX}"/bin/*

          # Verify the binaries really are self-contained: nothing may
          # resolve to an LLVM/MLIR shared library, and each must start from
          # a bare environment.
          for bin in rrc rene rrepl reussir-lsp; do
            echo "--- ldd ${bin}"
            ldd "${PREFIX}/bin/${bin}"
            if ldd "${PREFIX}/bin/${bin}" | grep -Ei 'libLLVM|libMLIR|not found'; then
              echo "::error::${bin} has unexpected dynamic dependencies"
              exit 1
            fi
            env -i PATH=/usr/bin:/bin "${PREFIX}/bin/${bin}" --help > /dev/null
          done

          XZ_OPT=-6 tar -cJf "${PREFIX}.tar.xz" "${PREFIX}"
          echo "ARCHIVE_NAME=${PREFIX}.tar.xz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-linux-${{ runner.arch }}-llvm${{ matrix.llvm-version }}
          path: ${{ env.ARCHIVE_NAME }}

  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install Homebrew dependencies
        run: |
          brew update
          # llvm@22 (keg-only) pins the toolchain: FindLLVM.cmake requires
          # LLVM 22.x and the unversioned formula moved on to 23.
          brew install cmake ninja llvm@22 spdlog python@3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-03-15
          components: rust-src, rustfmt, clippy

      - name: Setup environment paths
        run: |
          LLVM_PREFIX=$(brew --prefix llvm@22)
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> $GITHUB_ENV
          echo "${LLVM_PREFIX}/bin" >> $GITHUB_PATH
          # llvm@22 is keg-only: its lib dir no longer implies the shared
          # Homebrew lib dir on the linker path, so -lzstd/-lxml2 from
          # llvm-sys/tblgen-sys stop resolving without this.
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=${LLVM_PREFIX}/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LLVM_SYMBOLIZER_PATH=${LLVM_PREFIX}/bin/llvm-symbolizer" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: macos-15-llvm

      - name: Configure CMake
        run: |
          env RUSTC_WRAPPER=sccache \
          cmake -B build \
          -G Ninja \
          -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
          -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DREUSSIR_ENABLE_PEDANTIC=ON \
          -DREUSSIR_ENABLE_TESTS=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
          -DMLIR_DIR="${LLVM_PREFIX}/lib/cmake/mlir"

      - name: Build
        run: cmake --build build --parallel

      - name: Stage rrepl
        run: cmake --build build --target rrepl

      - name: Package
        run: |
          ARCH=$(uname -m)
          # Tag builds carry the version; main builds carry the date.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PREFIX="reussir-${GITHUB_REF_NAME}-macos-${ARCH}"
          else
            PREFIX="reussir-nightly-$(date +%Y-%m-%d)-macos-${ARCH}"
          fi
          mkdir -p "${PREFIX}/bin"

          # Only the user-facing toolchain ships: rrc and rrepl link
          # LLVM/MLIR and the Reussir backend statically, while rene and
          # reussir-lsp link no native LLVM code — so there are no bundled
          # dylibs and no install_name_tool fixups. No Rust toolchain and no
          # prebuilt runtime ship either: rene carries the reussir-rt source bundle
          # and bakes it with the user's own rust/cargo on first use.
          for bin in rrc rene rrepl reussir-lsp; do
            cp -a "build/bin/${bin}" "${PREFIX}/bin/"
          done

          # The statically linked C++ archives are built RelWithDebInfo;
          # drop their debug info. Stripping invalidates the ad-hoc (linker)
          # signature on arm64, so re-sign afterwards.
          strip -x "${PREFIX}"/bin/*
          codesign --force --sign - "${PREFIX}"/bin/*

          # Verify the binaries really are self-contained: nothing may
          # reference the Homebrew LLVM/MLIR dylibs, and each must start
          # from a bare environment.
          for bin in rrc rene rrepl reussir-lsp; do
            echo "--- otool -L ${bin}"
            otool -L "${PREFIX}/bin/${bin}"
            if otool -L "${PREFIX}/bin/${bin}" | grep -Ei 'libLLVM|libMLIR'; then
              echo "::error::${bin} has unexpected LLVM/MLIR dylib dependencies"
              exit 1
            fi
            env -i PATH=/usr/bin:/bin "${PREFIX}/bin/${bin}" --help > /dev/null
          done

          XZ_OPT=-6 tar -cJf "${PREFIX}.tar.xz" "${PREFIX}"
          echo "ARCHIVE_NAME=${PREFIX}.tar.xz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-macos-arm64
          path: ${{ env.ARCHIVE_NAME }}

  # Cross-built from Linux in the flake's windows-cross shell — no Windows
  # runner: GNU-driver clang + the xwin CRT/SDK compile the C++ backend to
  # COFF, the conda-forge MSVC LLVM (the same 22.1.8 the old windows-2025
  # job used) is linked statically through lld-link, cargo-xwin drives the
  # Rust side, and Wine smoke-runs every shipped binary from its packaged
  # directory. See scripts/build-windows-cross.sh.
  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-cross-llvm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The MSVC CRT + Windows SDK cargo-xwin unpacks on first use. Bump the
      # suffix when the workspace moves to a new xwin/SDK version.
      - name: Cache xwin CRT/SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}-v1

      # The conda-forge MSVC LLVM/MLIR prefix reussir-bake-msvc-llvm stages.
      # Keyed on the pinned LLVM version; bump the suffix when the bake's
      # package list in flake.nix changes.
      - name: Cache conda MSVC LLVM
        uses: actions/cache@v4
        with:
          path: ~/.cache/reussir-msvc-conda
          key: reussir-msvc-conda-llvm-22.1.8-v1

      - name: Bake conda MSVC LLVM/MLIR
        run: nix develop .#windows-cross --command reussir-bake-msvc-llvm

      - name: Build
        run: |
          nix develop .#windows-cross --command bash -c '
            env RUSTC_WRAPPER=sccache scripts/build-windows-cross.sh
          '

      - name: Package
        run: |
          nix develop .#windows-cross --command bash -c '
            set -euo pipefail
            # Tag builds carry the version; main builds carry the date.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              PREFIX="reussir-${GITHUB_REF_NAME}-windows-x64-msvc"
            else
              PREFIX="reussir-nightly-$(date +%Y-%m-%d)-windows-x64-msvc"
            fi
            mkdir -p "${PREFIX}/bin"
            REL=target/x86_64-pc-windows-msvc/release
            for bin in rrc rene rrepl reussir-lsp; do
              cp "${REL}/${bin}.exe" "${PREFIX}/bin/"
            done

            # Ship the transitive closure of conda-toolchain DLLs the
            # binaries actually import (zlib/zstd/libxml2 — the static LLVM
            # references their import libraries); everything else must come
            # from the OS.
            CONDA_BIN="$HOME/.cache/reussir-msvc-conda/Library/bin"
            changed=1
            while [ "$changed" = 1 ]; do
              changed=0
              for f in "${PREFIX}"/bin/*.exe "${PREFIX}"/bin/*.dll; do
                [ -e "$f" ] || continue
                for dll in $(llvm-readobj --coff-imports "$f" | sed -n "s/^ *Name: //p"); do
                  if [ -e "${CONDA_BIN}/${dll}" ] && [ ! -e "${PREFIX}/bin/${dll}" ]; then
                    cp "${CONDA_BIN}/${dll}" "${PREFIX}/bin/"
                    echo "Bundled conda DLL dependency: ${dll}"
                    changed=1
                  fi
                done
              done
            done

            # Every binary must start under Wine resolving DLLs only from
            # its own packaged directory.
            for bin in rrc rene rrepl reussir-lsp; do
              WINEDEBUG=-all wine "${PREFIX}/bin/${bin}.exe" --help > /dev/null
            done

            python3 -m zipfile -c "${PREFIX}.zip" "${PREFIX}"
            echo "ARCHIVE_NAME=${PREFIX}.zip" >> "$GITHUB_ENV"
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-windows-x64
          path: ${{ env.ARCHIVE_NAME }}

  publish-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The rolling-nightly bookkeeping only applies to main builds: a tag
      # build publishes under its own immutable tag and must leave the
      # nightly release alone.
      - name: Delete existing nightly release
        if: github.ref_type != 'tag'
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force-tag nightly
        if: github.ref_type != 'tag'
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create or update nightly release
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.tar.xz
            artifacts/*.zip
          body: |
            Automated nightly build from `${{ github.sha }}`.

            **Contents:** the Reussir toolchain — `rrc` (ahead-of-time compiler), `rene` (package manager), `rrepl` (REPL), and `reussir-lsp` (semantic-token language server). LLVM/MLIR and the Reussir backend are linked statically into the binaries; no shared libraries ship and nothing needs `LD_LIBRARY_PATH`.

            **Platforms:**
            - Linux x86_64 (built against LLVM 22)
            - Linux aarch64 (built against LLVM 22)
            - macOS ARM64 (built against Homebrew LLVM 22)
            - Windows x64 (built against MSVC LLVM via conda-forge)

            **Usage:** Extract the archive and add `<prefix>/bin` to `PATH`.

            Compiling programs requires a Rust toolchain (`rustc`/`cargo`) on `PATH`: the bundled `rene` bakes the `reussir-rt` runtime from its embedded source with your toolchain on first use — no toolchain or prebuilt runtime ships in this archive.

      - name: Create versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Reussir ${{ github.ref_name }}"
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.xz
            artifacts/*.zip
          body: |
            Reussir ${{ github.ref_name }}, built from `${{ github.sha }}`. See `CHANGELOG.md` for the release notes.

            **Contents:** the Reussir toolchain — `rrc` (ahead-of-time compiler), `rene` (package manager), `rrepl` (REPL), and `reussir-lsp` (semantic-token language server). LLVM/MLIR and the Reussir backend are linked statically into the binaries; no shared libraries ship and nothing needs `LD_LIBRARY_PATH`.

            **Platforms:**
            - Linux x86_64 (built against LLVM 22)
            - Linux aarch64 (built against LLVM 22)
            - macOS ARM64 (built against Homebrew LLVM 22)
            - Windows x64 (built against MSVC LLVM via conda-forge)

            **Usage:** Extract the archive and add `<prefix>/bin` to `PATH`.

            Compiling programs requires a Rust toolchain (`rustc`/`cargo`) on `PATH`: the bundled `rene` bakes the `reussir-rt` runtime from its embedded source with your toolchain on first use — no toolchain or prebuilt runtime ships in this archive.
