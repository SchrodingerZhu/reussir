name: Nightly Release

# Every push to main refreshes the rolling `nightly` prerelease; pushing a
# `v*` tag runs the same build matrix but publishes a versioned release
# under that tag instead (marked latest, nightly untouched).
#
# This pipeline builds and packages only — no tests run here. Correctness
# is gated by the test pipelines (MLIR Backend MultiArch, the macOS and
# Windows full pipelines, Rene Tests, Miri) on every PR and push; a
# release build repeating them doubles the wall-clock for no signal. The
# packaging steps still verify each shipped binary is self-contained and
# starts from a bare environment.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Both jobs build from the Nix flake (same toolchain as every test
  # pipeline and every developer). Portability of the artifacts is restored
  # in the packaging steps: on Linux, patchelf points the ELF interpreter at
  # the standard /lib*/ld-linux path and drops the /nix/store rpath (the
  # binaries' real glibc symbol floor is 2.39 = Ubuntu 24.04, same as the
  # old apt builds); on macOS, install_name_tool rewrites the /nix/store
  # dylib references to the OS-provided /usr/lib equivalents. Each shipped
  # binary is then executed from a bare environment as proof.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      # sccache talks to the shared S3 bucket directly (no tarball round trip
      # through actions/cache), and the Nix daemon gets the same bucket as a
      # zstd binary cache for what cache.nixos.org does not serve (the fenix
      # Rust toolchain, the LLVM/MLIR join). Without credentials — pull
      # requests from forks — both fall back to local disk / cache.nixos.org.
      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          sccache-key-prefix: ${{ matrix.os }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      - name: Build dev shell
        run: nix develop --command true

      - name: Start sccache
        uses: ./.github/actions/sccache-start
        with:
          shell: default

      - name: Push dev shell closure to Nix cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-push.sh default

      - name: Configure CMake
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache \
            cmake --preset nix-dev -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DREUSSIR_ENABLE_PEDANTIC=ON \
            -DREUSSIR_ENABLE_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          '

      - name: Build
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache \
            cmake --build build --parallel
          '

      - name: Stage rrepl
        run: nix develop --command bash -c 'env RUSTC_WRAPPER=sccache cmake --build build --target rrepl'

      - name: Package
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            ARCH=$(uname -m)
            # Tag builds carry the version; main builds carry the date.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              PREFIX="reussir-${GITHUB_REF_NAME}-linux-${ARCH}"
            else
              PREFIX="reussir-nightly-$(date +%Y-%m-%d)-linux-${ARCH}"
            fi
            mkdir -p "${PREFIX}/bin"

            # Only the user-facing toolchain ships: rrc and rrepl link
            # LLVM/MLIR and the Reussir backend statically, while rene and
            # reussir-lsp link no native LLVM code. No Rust toolchain and no
            # prebuilt runtime ship either: rene bakes reussir-rt from its
            # embedded source with the end-user rust/cargo toolchain on first use.
            for bin in rrc rene rrepl reussir-lsp; do
              cp -a "build/bin/${bin}" "${PREFIX}/bin/"
            done

            # The statically linked C++ archives are built RelWithDebInfo;
            # drop their debug info.
            strip --strip-debug "${PREFIX}"/bin/*

            # Un-nix the ELFs: standard interpreter path, no store rpath.
            case "$ARCH" in
              x86_64)  INTERP=/lib64/ld-linux-x86-64.so.2 ;;
              aarch64) INTERP=/lib/ld-linux-aarch64.so.1 ;;
              *) echo "::error::unknown arch $ARCH"; exit 1 ;;
            esac
            nix run --inputs-from . nixpkgs#patchelf -- \
              --set-interpreter "$INTERP" --remove-rpath "${PREFIX}"/bin/*

            echo "REUSSIR_PREFIX=${PREFIX}" >> "$GITHUB_ENV"
          '

      # Deliberately OUTSIDE nix develop: the dev shell exports
      # LD_LIBRARY_PATH full of store paths, which makes ldd resolve every
      # library to /nix/store and trips the gate below even on correctly
      # patched binaries. The stock runner environment is exactly what
      # end-user machines provide.
      - name: Verify and archive
        run: |
          set -euo pipefail
          PREFIX="${REUSSIR_PREFIX}"
          for bin in rrc rene rrepl reussir-lsp; do
            echo "--- ldd ${bin}"
            ldd "${PREFIX}/bin/${bin}"
            if ldd "${PREFIX}/bin/${bin}" | grep -Ei "libLLVM|libMLIR|/nix/store|not found"; then
              echo "::error::${bin} has unexpected dynamic dependencies"
              exit 1
            fi
            env -i PATH=/usr/bin:/bin "${PREFIX}/bin/${bin}" --help > /dev/null
          done

          XZ_OPT=-6 tar -cJf "${PREFIX}.tar.xz" "${PREFIX}"
          echo "ARCHIVE_NAME=${PREFIX}.tar.xz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-linux-${{ runner.arch }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: |
          nix develop --command sccache --show-stats
          [ -f "$SCCACHE_ERROR_LOG" ] && cat "$SCCACHE_ERROR_LOG" || true

  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      # sccache talks to the shared S3 bucket directly (no tarball round trip
      # through actions/cache), and the Nix daemon gets the same bucket as a
      # zstd binary cache for what cache.nixos.org does not serve (the fenix
      # Rust toolchain, the LLVM/MLIR join). Without credentials — pull
      # requests from forks — both fall back to local disk / cache.nixos.org.
      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          sccache-key-prefix: macos-15

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      - name: Build dev shell
        run: nix develop --command true

      - name: Start sccache
        uses: ./.github/actions/sccache-start
        with:
          shell: default

      - name: Push dev shell closure to Nix cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-push.sh default

      - name: Configure CMake
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache \
            cmake --preset nix-dev -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DREUSSIR_ENABLE_PEDANTIC=ON \
            -DREUSSIR_ENABLE_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          '

      - name: Build
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache \
            cmake --build build --parallel
          '

      - name: Stage rrepl
        run: nix develop --command bash -c 'env RUSTC_WRAPPER=sccache cmake --build build --target rrepl'

      - name: Package
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            ARCH=$(uname -m)
            # Tag builds carry the version; main builds carry the date.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              PREFIX="reussir-${GITHUB_REF_NAME}-macos-${ARCH}"
            else
              PREFIX="reussir-nightly-$(date +%Y-%m-%d)-macos-${ARCH}"
            fi
            mkdir -p "${PREFIX}/bin"

            for bin in rrc rene rrepl reussir-lsp; do
              cp -a "build/bin/${bin}" "${PREFIX}/bin/"
            done

            # Un-nix the Mach-O load commands. ABI-stable system libraries
            # are rewritten to their canonical /usr/lib names (an explicit
            # allowlist: dyld-cache libraries cannot be existence-tested, and
            # blind basename mapping broke on libxml2 — nix ships soversion
            # 16, macOS soversion 2). Every other nix dylib is bundled into
            # <prefix>/lib and referenced relatively; bundled dylibs get the
            # same treatment recursively (libxml2 pulls in liblzma etc.).
            # Stripping and the rewrites invalidate the ad-hoc signature, so
            # everything is re-signed at the end.
            strip -x "${PREFIX}"/bin/*
            rewrite() {
              local file=$1 ref_prefix=$2
              otool -L "$file" | awk "/\/nix\/store/ {print \$1}" | while read -r dep; do
                local base; base=$(basename "$dep")
                case "$base" in
                  libc++.1.dylib|libc++abi.dylib|libc++abi.1.dylib|libSystem.B.dylib|libiconv.2.dylib|libcharset.1.dylib|libobjc.A.dylib|libresolv.9.dylib)
                    install_name_tool -change "$dep" "/usr/lib/$base" "$file" ;;
                  libz.dylib|libz.1.dylib)
                    install_name_tool -change "$dep" /usr/lib/libz.1.dylib "$file" ;;
                  *)
                    mkdir -p "${PREFIX}/lib"
                    if [ ! -e "${PREFIX}/lib/$base" ]; then
                      cp "$dep" "${PREFIX}/lib/$base"
                      chmod +w "${PREFIX}/lib/$base"
                      install_name_tool -id "@loader_path/$base" "${PREFIX}/lib/$base"
                    fi
                    install_name_tool -change "$dep" "$ref_prefix/$base" "$file" ;;
                esac
              done
            }
            for bin in "${PREFIX}"/bin/*; do
              rewrite "$bin" "@executable_path/../lib"
            done
            # Fixpoint over the bundled dylibs (each pass may add new ones).
            for _ in 1 2 3 4 5; do
              found=0
              for lib in "${PREFIX}"/lib/*.dylib; do
                [ -e "$lib" ] || continue
                if otool -L "$lib" | grep -q "/nix/store"; then
                  found=1
                  rewrite "$lib" "@loader_path"
                fi
              done
              [ "$found" = 0 ] && break
            done
            for macho in "${PREFIX}"/bin/* "${PREFIX}"/lib/*.dylib; do
              [ -e "$macho" ] || continue
              codesign --force --sign - "$macho"
            done

            # Verify: no store references survive anywhere in the archive,
            # nothing may resolve to an LLVM/MLIR dylib, and each binary
            # starts from a bare environment.
            for macho in "${PREFIX}"/lib/*.dylib; do
              [ -e "$macho" ] || continue
              echo "--- otool -L $(basename "$macho")"
              otool -L "$macho"
              if otool -L "$macho" | grep -Ei "libLLVM|libMLIR|/nix/store"; then
                echo "::error::bundled $(basename "$macho") still references the nix store"
                exit 1
              fi
            done
            for bin in rrc rene rrepl reussir-lsp; do
              echo "--- otool -L ${bin}"
              otool -L "${PREFIX}/bin/${bin}"
              if otool -L "${PREFIX}/bin/${bin}" | grep -Ei "libLLVM|libMLIR|/nix/store"; then
                echo "::error::${bin} still references the nix store or LLVM dylibs"
                exit 1
              fi
              env -i PATH=/usr/bin:/bin "${PREFIX}/bin/${bin}" --help > /dev/null
            done

            XZ_OPT=-6 tar -cJf "${PREFIX}.tar.xz" "${PREFIX}"
            echo "ARCHIVE_NAME=${PREFIX}.tar.xz" >> "$GITHUB_ENV"
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-macos-arm64
          path: ${{ env.ARCHIVE_NAME }}

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: |
          nix develop --command sccache --show-stats
          [ -f "$SCCACHE_ERROR_LOG" ] && cat "$SCCACHE_ERROR_LOG" || true


  # Cross-built from Linux in the flake's windows-cross shell — no Windows
  # runner: GNU-driver clang + the xwin CRT/SDK compile the C++ backend to
  # COFF, the conda-forge MSVC LLVM (the same 23.1.0 the old windows-2025
  # job used) is linked statically through lld-link, cargo-xwin drives the
  # Rust side, and Wine smoke-runs every shipped binary from its packaged
  # directory. See scripts/build-windows-cross.sh.
  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      # sccache talks to the shared S3 bucket directly (no tarball round trip
      # through actions/cache), and the Nix daemon gets the same bucket as a
      # zstd binary cache for what cache.nixos.org does not serve (the fenix
      # Rust toolchain, the LLVM/MLIR join). Without credentials — pull
      # requests from forks — both fall back to local disk / cache.nixos.org.
      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          sccache-key-prefix: windows-cross

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      # cargo's registry/git checkouts and the target dir, keyed on the lock
      # file and toolchain pin with a prefix fallback (what Swatinem/rust-cache
      # did through actions/cache), now snapshotted to the S3 bucket.
      - name: Restore cargo cache
        id: cache-cargo
        uses: ./.github/actions/s3-dir-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-cross-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-windows-cross-release-${{ runner.os }}-${{ runner.arch }}-

      # The MSVC CRT + Windows SDK cargo-xwin unpacks on first use. Bump the
      # suffix when the workspace moves to a new xwin/SDK version.
      - name: Restore xwin CRT/SDK cache
        id: cache-xwin-crt-sdk
        uses: ./.github/actions/s3-dir-cache
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}-v2

      # The conda-forge MSVC LLVM/MLIR prefix reussir-bake-msvc-llvm stages.
      # Keyed on the pinned LLVM version; bump the suffix when the bake's
      # package list in flake.nix changes.
      - name: Restore conda MSVC LLVM cache
        id: cache-conda-msvc-llvm
        uses: ./.github/actions/s3-dir-cache
        with:
          path: ~/.cache/reussir-msvc-conda
          key: reussir-msvc-conda-llvm-23.1.0-v1

      - name: Build dev shell
        run: nix develop .#windows-cross --command true

      - name: Start sccache
        uses: ./.github/actions/sccache-start
        with:
          shell: windows-cross

      - name: Push dev shell closure to Nix cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-push.sh windows-cross

      - name: Bake conda MSVC LLVM/MLIR
        run: nix develop .#windows-cross --command reussir-bake-msvc-llvm

      - name: Build
        run: |
          nix develop .#windows-cross --command bash -c '
            env RUSTC_WRAPPER=sccache scripts/build-windows-cross.sh
          '

      - name: Package
        run: |
          nix develop .#windows-cross --command bash -c '
            set -euo pipefail
            # Tag builds carry the version; main builds carry the date.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              PREFIX="reussir-${GITHUB_REF_NAME}-windows-x64-msvc"
            else
              PREFIX="reussir-nightly-$(date +%Y-%m-%d)-windows-x64-msvc"
            fi
            mkdir -p "${PREFIX}/bin"
            REL=target/x86_64-pc-windows-msvc/release
            for bin in rrc rene rrepl reussir-lsp; do
              cp "${REL}/${bin}.exe" "${PREFIX}/bin/"
            done

            # Ship the transitive closure of conda-toolchain DLLs the
            # binaries actually import (zlib/zstd/libxml2 — the static LLVM
            # references their import libraries); everything else must come
            # from the OS.
            CONDA_BIN="$HOME/.cache/reussir-msvc-conda/Library/bin"
            changed=1
            while [ "$changed" = 1 ]; do
              changed=0
              for f in "${PREFIX}"/bin/*.exe "${PREFIX}"/bin/*.dll; do
                [ -e "$f" ] || continue
                for dll in $(llvm-readobj --coff-imports "$f" | sed -n "s/^ *Name: //p"); do
                  if [ -e "${CONDA_BIN}/${dll}" ] && [ ! -e "${PREFIX}/bin/${dll}" ]; then
                    cp "${CONDA_BIN}/${dll}" "${PREFIX}/bin/"
                    echo "Bundled conda DLL dependency: ${dll}"
                    changed=1
                  fi
                done
              done
            done

            # Every binary must start under Wine resolving DLLs only from
            # its own packaged directory.
            for bin in rrc rene rrepl reussir-lsp; do
              WINEDEBUG=-all wine "${PREFIX}/bin/${bin}.exe" --help > /dev/null
            done

            python3 -m zipfile -c "${PREFIX}.zip" "${PREFIX}"
            echo "ARCHIVE_NAME=${PREFIX}.zip" >> "$GITHUB_ENV"
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-windows-x64
          path: ${{ env.ARCHIVE_NAME }}

      - name: Save cargo cache
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-cross-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save xwin CRT/SDK cache
        if: steps.cache-xwin-crt-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}-v2

      - name: Save conda MSVC LLVM cache
        if: steps.cache-conda-msvc-llvm.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: ~/.cache/reussir-msvc-conda
          key: reussir-msvc-conda-llvm-23.1.0-v1

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: |
          nix develop .#windows-cross --command sccache --show-stats
          [ -f "$SCCACHE_ERROR_LOG" ] && cat "$SCCACHE_ERROR_LOG" || true

  publish-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The rolling-nightly bookkeeping only applies to main builds: a tag
      # build publishes under its own immutable tag and must leave the
      # nightly release alone.
      - name: Delete existing nightly release
        if: github.ref_type != 'tag'
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force-tag nightly
        if: github.ref_type != 'tag'
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create or update nightly release
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.tar.xz
            artifacts/*.zip
          body: |
            Automated nightly build from `${{ github.sha }}`.

            **Contents:** the Reussir toolchain — `rrc` (ahead-of-time compiler), `rene` (package manager), `rrepl` (REPL), and `reussir-lsp` (semantic-token language server). LLVM/MLIR and the Reussir backend are linked statically into the binaries; no shared libraries ship and nothing needs `LD_LIBRARY_PATH`.

            **Platforms:**
            - Linux x86_64 (Nix flake toolchain, LLVM 23; needs glibc >= 2.39)
            - Linux aarch64 (Nix flake toolchain, LLVM 23; needs glibc >= 2.39)
            - macOS ARM64 (Nix flake toolchain, LLVM 23)
            - Windows x64 (cross-built with the flake's windows-cross shell against conda-forge MSVC LLVM 23)

            **Usage:** Extract the archive and add `<prefix>/bin` to `PATH`.

            Compiling programs requires a Rust toolchain (`rustc`/`cargo`) on `PATH`: the bundled `rene` bakes the `reussir-rt` runtime from its embedded source with your toolchain on first use — no toolchain or prebuilt runtime ships in this archive.

      - name: Create versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Reussir ${{ github.ref_name }}"
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.xz
            artifacts/*.zip
          body: |
            Reussir ${{ github.ref_name }}, built from `${{ github.sha }}`. See `CHANGELOG.md` for the release notes.

            **Contents:** the Reussir toolchain — `rrc` (ahead-of-time compiler), `rene` (package manager), `rrepl` (REPL), and `reussir-lsp` (semantic-token language server). LLVM/MLIR and the Reussir backend are linked statically into the binaries; no shared libraries ship and nothing needs `LD_LIBRARY_PATH`.

            **Platforms:**
            - Linux x86_64 (Nix flake toolchain, LLVM 23; needs glibc >= 2.39)
            - Linux aarch64 (Nix flake toolchain, LLVM 23; needs glibc >= 2.39)
            - macOS ARM64 (Nix flake toolchain, LLVM 23)
            - Windows x64 (cross-built with the flake's windows-cross shell against conda-forge MSVC LLVM 23)

            **Usage:** Extract the archive and add `<prefix>/bin` to `PATH`.

            Compiling programs requires a Rust toolchain (`rustc`/`cargo`) on `PATH`: the bundled `rene` bakes the `reussir-rt` runtime from its embedded source with your toolchain on first use — no toolchain or prebuilt runtime ships in this archive.
