name: Nightly Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        llvm-version: [22]
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-15
          components: rust-src, rustfmt, clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget libgtest-dev libgmock-dev libspdlog-dev libgmp-dev patchelf
          sudo pip install lit --break-system-packages

      - name: Install LLVM ${{ matrix.llvm-version }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          CODENAME=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${{ matrix.llvm-version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.llvm-version }} \
            lldb-${{ matrix.llvm-version }} \
            lld-${{ matrix.llvm-version }} \
            clangd-${{ matrix.llvm-version }} \
            libmlir-${{ matrix.llvm-version }}-dev \
            mlir-${{ matrix.llvm-version }}-tools \
            llvm-${{ matrix.llvm-version }}-dev \
            llvm-${{ matrix.llvm-version }}-tools
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${{ matrix.llvm-version }}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LLVM_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-${{ matrix.llvm-version }}" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ matrix.os }}-${{ matrix.llvm-version }}

      - name: Configure CMake
        run: |
          env RUSTC_WRAPPER=sccache \
          cmake -B build \
          -G Ninja \
          -DLLVM_USE_LINKER=lld \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.llvm-version }} \
          -DCMAKE_C_COMPILER=clang-${{ matrix.llvm-version }} \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DREUSSIR_ENABLE_PEDANTIC=ON \
          -DREUSSIR_ENABLE_TESTS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm-version }}/lib/cmake/llvm \
          -DMLIR_DIR=/usr/lib/llvm-${{ matrix.llvm-version }}/lib/cmake/mlir

      - name: Build
        run: cmake --build build --parallel

      - name: Run Unit Tests
        run: |
          cmake --build build --target reussir-ut
          ctest --test-dir build --output-on-failure

      - name: Run Integration Tests
        run: cmake --build build --target check

      - name: Package
        run: |
          DATE=$(date +%Y-%m-%d)
          LLVM_VER=${{ matrix.llvm-version }}
          ARCH=$(uname -m)
          PREFIX="reussir-nightly-${DATE}-linux-${ARCH}-llvm${LLVM_VER}"
          mkdir -p "${PREFIX}/bin" "${PREFIX}/lib"

          # Copy binaries
          for bin in reussir-opt reussir-translate rrc reussir-syntax \
                     rustc cargo rustdoc; do
            cp -a "build/bin/${bin}" "${PREFIX}/bin/"
          done

          # Copy shared libraries
          cp -a build/lib/libreussir_rt.so "${PREFIX}/lib/" 2>/dev/null || true
          cp -a build/lib/libMLIRReussirBridge* "${PREFIX}/lib/" 2>/dev/null || true
          # Exclude static libs
          rm -f "${PREFIX}"/lib/libMLIRReussir*.a
          cp -a build/lib/libLLVM*rust*.so* "${PREFIX}/lib/" 2>/dev/null || true
          cp -a build/lib/librustc_driver*.so "${PREFIX}/lib/" 2>/dev/null || true
          cp -a build/lib/rustlib "${PREFIX}/lib/"

          # Copy system LLVM/MLIR shared libraries
          LLVM_LIB="/usr/lib/llvm-${LLVM_VER}/lib"
          cp -a "${LLVM_LIB}"/libMLIR.so* "${PREFIX}/lib/"
          cp -a "${LLVM_LIB}"/libLLVM.so* "${PREFIX}/lib/"
          # Also copy libMLIR C-API style libs if present
          cp -a "${LLVM_LIB}"/libMLIR-${LLVM_VER}*.so* "${PREFIX}/lib/" 2>/dev/null || true
          cp -a "${LLVM_LIB}"/libLLVM-${LLVM_VER}*.so* "${PREFIX}/lib/" 2>/dev/null || true

          # On Ubuntu, libLLVM.so.XX.Y is a relative symlink into the
          # multiarch directory (../../x86_64-linux-gnu/...) which dangles
          # once extracted outside /usr/lib/llvm-XX/lib.  Replace any such
          # dangling symlinks with the actual library file.
          for f in "${PREFIX}"/lib/lib{LLVM,MLIR}*.so*; do
            if [ -L "$f" ] && [ ! -e "$f" ]; then
              orig="${LLVM_LIB}/$(basename "$f")"
              rm "$f"
              cp -L "$orig" "$f"
            fi
          done

          # Strip debug info from C++ binaries
          strip --strip-debug "${PREFIX}"/bin/reussir-opt "${PREFIX}"/bin/reussir-translate 2>/dev/null || true

          # Patch RPATHs for relocatable package
          for f in "${PREFIX}"/bin/*; do
            [ -f "$f" ] && patchelf --set-rpath '$ORIGIN/../lib' "$f" 2>/dev/null || true
          done
          for f in "${PREFIX}"/lib/*.so*; do
            [ -f "$f" ] && [ ! -L "$f" ] && patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done

          XZ_OPT=-6 tar -cJf "${PREFIX}.tar.xz" "${PREFIX}"
          echo "ARCHIVE_NAME=${PREFIX}.tar.xz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-linux-${{ runner.arch }}-llvm${{ matrix.llvm-version }}
          path: ${{ env.ARCHIVE_NAME }}

  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install cmake ninja llvm spdlog googletest python@3
          pip3 install lit --break-system-packages

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-15
          components: rust-src, rustfmt, clippy

      - name: Setup environment paths
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> $GITHUB_ENV
          echo "${LLVM_PREFIX}/bin" >> $GITHUB_PATH
          echo "DYLD_LIBRARY_PATH=${LLVM_PREFIX}/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LLVM_SYMBOLIZER_PATH=${LLVM_PREFIX}/bin/llvm-symbolizer" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: macos-15-llvm

      - name: Configure CMake
        run: |
          env RUSTC_WRAPPER=sccache \
          cmake -B build \
          -G Ninja \
          -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
          -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DREUSSIR_ENABLE_PEDANTIC=ON \
          -DREUSSIR_ENABLE_TESTS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
          -DMLIR_DIR="${LLVM_PREFIX}/lib/cmake/mlir"

      - name: Build
        run: cmake --build build --parallel

      - name: Run Unit Tests
        run: |
          cmake --build build --target reussir-ut
          ctest --test-dir build --output-on-failure

      - name: Run Integration Tests
        run: |
          export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/lib:${LLVM_PREFIX}/lib:$DYLD_LIBRARY_PATH"
          cmake --build build --target check

      - name: Package
        run: |
          DATE=$(date +%Y-%m-%d)
          LLVM_VER=$("${LLVM_PREFIX}/bin/llvm-config" --version | cut -d. -f1)
          ARCH=$(uname -m)
          PREFIX="reussir-nightly-${DATE}-macos-${ARCH}-llvm${LLVM_VER}"
          mkdir -p "${PREFIX}/bin" "${PREFIX}/lib"

          # Copy binaries
          for bin in reussir-opt reussir-translate rrc reussir-syntax \
                     rustc cargo rustdoc; do
            cp -a "build/bin/${bin}" "${PREFIX}/bin/"
          done

          # Copy shared libraries
          cp -a build/lib/libreussir_rt.dylib "${PREFIX}/lib/" 2>/dev/null || true
          cp -a build/lib/libMLIRReussirBridge* "${PREFIX}/lib/" 2>/dev/null || true
          # Exclude static libs
          rm -f "${PREFIX}"/lib/libMLIRReussir*.a
          cp -a build/lib/libLLVM*rust*.dylib* "${PREFIX}/lib/" 2>/dev/null || true
          cp -a build/lib/librustc_driver*.dylib "${PREFIX}/lib/" 2>/dev/null || true
          cp -a build/lib/rustlib "${PREFIX}/lib/"

          # Copy system LLVM/MLIR shared libraries
          cp -a "${LLVM_PREFIX}/lib"/libMLIR*.dylib "${PREFIX}/lib/"
          cp -a "${LLVM_PREFIX}/lib"/libLLVM*.dylib "${PREFIX}/lib/"

          # Strip debug info
          strip -x "${PREFIX}"/bin/reussir-opt "${PREFIX}"/bin/reussir-translate 2>/dev/null || true

          # Patch rpaths for relocatable package
          for f in "${PREFIX}"/bin/*; do
            [ -f "$f" ] || continue
            # Add relative rpath
            install_name_tool -add_rpath @executable_path/../lib "$f" 2>/dev/null || true
            # Rewrite references to system LLVM libs
            for lib in $(otool -L "$f" | grep "${LLVM_PREFIX}/lib" | awk '{print $1}'); do
              base=$(basename "$lib")
              install_name_tool -change "$lib" "@rpath/${base}" "$f" 2>/dev/null || true
            done
          done
          for f in "${PREFIX}"/lib/*.dylib; do
            [ -f "$f" ] || continue
            install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true
            for lib in $(otool -L "$f" | grep "${LLVM_PREFIX}/lib" | awk '{print $1}'); do
              base=$(basename "$lib")
              install_name_tool -change "$lib" "@rpath/${base}" "$f" 2>/dev/null || true
            done
          done

          XZ_OPT=-6 tar -cJf "${PREFIX}.tar.xz" "${PREFIX}"
          echo "ARCHIVE_NAME=${PREFIX}.tar.xz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-macos-arm64
          path: ${{ env.ARCHIVE_NAME }}

  build-windows:
    runs-on: windows-2025
    env:
      LLVM_VERSION: 22.1.8
      CONDA_ENV_FILE: .github/conda/windows-msvc.yml
      CONDA_PKGS_DIR: D:\conda_pkgs_dir
      CONDA_ENV_PATH: D:\conda_envs\reussir-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dev Drive
        uses: samypr100/setup-dev-drive@v3
        with:
          drive-size: 20GB
          workspace-copy: true
          trusted-dev-drive: true

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2
        with:
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Could not find a Visual Studio installation with the x64 C++ tools."
          }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $before = @{}
          cmd /c set | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $before[$matches[1].ToUpperInvariant()] = $matches[2]
            }
          }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              $upper = $name.ToUpperInvariant()
              $skip = $upper.StartsWith("GITHUB_") -or $upper.StartsWith("RUNNER_") -or $upper.StartsWith("ACTIONS_")
              if (-not $skip -and ((-not $before.ContainsKey($upper)) -or $before[$upper] -ne $value)) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Cache Conda packages
        uses: actions/cache@v4
        with:
          enableCrossOsArchive: true
          path: ${{ env.CONDA_PKGS_DIR }}
          key: windows-msvc-conda-pkgs-${{ runner.arch }}-${{ hashFiles('.github/conda/windows-msvc.yml') }}-v1
          restore-keys: |
            windows-msvc-conda-pkgs-${{ runner.arch }}-

      - name: Cache Conda environment
        id: cache-conda-env
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA_ENV_PATH }}
          key: windows-msvc-conda-env-${{ runner.arch }}-${{ hashFiles('.github/conda/windows-msvc.yml') }}-v1

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_PATH }}
          auto-activate: true
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"
          pkgs-dirs: ${{ env.CONDA_PKGS_DIR }}

      - name: Install Conda dependencies
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:CONDA_ENV_PATH "Library"
          $mlirConfig = Join-Path $llvmRoot "lib\cmake\mlir\MLIRConfig.cmake"
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if ((Test-Path $mlirConfig) -and (Test-Path $llvmConfig)) {
            Write-Host "Using cached Conda environment at $env:CONDA_ENV_PATH"
            conda list --prefix "$env:CONDA_ENV_PATH"
          } else {
            Write-Host "Cached Conda environment is missing LLVM/MLIR; updating $env:CONDA_ENV_PATH"
            conda env update --prefix "$env:CONDA_ENV_PATH" --file "$env:CONDA_ENV_FILE" --prune
          }

      - name: Setup LLVM paths
        shell: pwsh
        run: |
          conda list
          $llvmRoot = Join-Path $env:CONDA_PREFIX "Library"
          if (-not (Test-Path "$llvmRoot\lib\cmake\mlir\MLIRConfig.cmake")) {
            throw "Conda MLIR package did not provide MLIRConfig.cmake."
          }
          if (-not (Test-Path "$llvmRoot\lib\cmake\llvm\LLVMConfig.cmake")) {
            throw "Conda LLVM package did not provide LLVMConfig.cmake."
          }
          $xml2ImportLib = Join-Path $llvmRoot "lib\xml2.lib"
          if (-not (Test-Path $xml2ImportLib)) {
            $xml2Candidates = @(
              (Join-Path $llvmRoot "lib\libxml2.lib"),
              (Join-Path $llvmRoot "lib\libxml2.dll.lib"),
              (Join-Path $llvmRoot "lib\xml2.dll.lib")
            )
            $xml2Source = $xml2Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $xml2Source) {
              $xml2Source = Get-ChildItem -Path (Join-Path $llvmRoot "lib") -Filter "*xml2*.lib" -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName -First 1
            }
            if ($xml2Source) {
              Copy-Item $xml2Source $xml2ImportLib
              Write-Host "Created xml2 import library alias: $xml2ImportLib -> $xml2Source"
            } else {
              $xml2Dll = Get-ChildItem -Path (Join-Path $llvmRoot "bin") -Filter "*xml2*.dll" -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if (-not $xml2Dll) {
                throw "Conda libxml2 package did not provide a DLL matching *xml2*.dll."
              }
              $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
              $libTool = Get-Command lib.exe -ErrorAction SilentlyContinue
              if (-not $dumpbin -or -not $libTool) {
                throw "MSVC dumpbin.exe and lib.exe are required to generate xml2.lib."
              }
              $exports = & $dumpbin.Source /exports $xml2Dll.FullName | ForEach-Object {
                if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+([^=\s]+)') { $matches[1] }
              } | Sort-Object -Unique
              if (-not $exports) {
                throw "Could not read exports from $($xml2Dll.FullName)."
              }
              $tempDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
              $xml2Def = Join-Path $tempDir "xml2.def"
              @("LIBRARY $($xml2Dll.Name)", "EXPORTS") + ($exports | ForEach-Object { "  $_" }) |
                Set-Content -Path $xml2Def -Encoding ascii
              & $libTool.Source /nologo /def:$xml2Def /machine:x64 /out:$xml2ImportLib
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $xml2ImportLib)) {
                throw "Failed to generate xml2.lib from $($xml2Dll.FullName)."
              }
              Write-Host "Generated xml2 import library: $xml2ImportLib from $($xml2Dll.FullName)"
            }
          }
          function Ensure-LibAlias($aliasName, [string[]]$candidates) {
            $aliasPath = Join-Path $llvmRoot "lib\$aliasName"
            if (Test-Path $aliasPath) {
              return
            }
            $source = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $source) {
              $stem = [System.IO.Path]::GetFileNameWithoutExtension($aliasName)
              $source = Get-ChildItem -Path (Join-Path $llvmRoot "lib") -Filter "*$stem*.lib" -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName -First 1
            }
            if (-not $source) {
              throw "Conda package did not provide a source import library for $aliasName."
            }
            Copy-Item $source $aliasPath
            Write-Host "Created import library alias: $aliasPath -> $source"
          }
          Ensure-LibAlias "zstd.dll.lib" @(
            (Join-Path $llvmRoot "lib\zstd.lib"),
            (Join-Path $llvmRoot "lib\libzstd.lib"),
            (Join-Path $llvmRoot "lib\zstd.dll.lib")
          )
          $fileCheck = Get-Command FileCheck.exe -ErrorAction SilentlyContinue
          if (-not $fileCheck) {
            $fileCheck = Get-Command filecheck.exe -ErrorAction SilentlyContinue
          }
          if (-not $fileCheck) {
            $fileCheck = Get-Command filecheck -ErrorAction SilentlyContinue
          }
          if (-not $fileCheck) {
            throw "Neither LLVM FileCheck nor the Python filecheck replacement is available."
          }
          $fileCheckDir = Split-Path -Parent $fileCheck.Source
          Write-Host "FileCheck-compatible tool: $($fileCheck.Source)"
          "LLVM_PREFIX=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_SYMBOLIZER_PATH=$llvmRoot\bin\llvm-symbolizer.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FILECHECK_PATH=$($fileCheck.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fileCheckDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-15
          components: rust-src, rustfmt, clippy

      - name: sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-msvc-conda-llvm-${{ env.LLVM_VERSION }}

      - name: Configure CMake
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          $env:RUSTC_WRAPPER = "sccache"
          $env:PATH = "$env:LLVM_PREFIX\bin;$env:PATH"
          cmake -B build `
            -G Ninja `
            -DCMAKE_C_COMPILER="$env:LLVM_PREFIX\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_PREFIX\bin\clang++.exe" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DREUSSIR_ENABLE_PEDANTIC=ON `
            -DREUSSIR_ENABLE_TESTS=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DLLVM_DIR="$env:LLVM_PREFIX\lib\cmake\llvm" `
            -DMLIR_DIR="$env:LLVM_PREFIX\lib\cmake\mlir" `
            -Dfilecheck_path="$env:FILECHECK_PATH"

      - name: Build
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          $env:RUSTC_WRAPPER = "sccache"
          $env:PATH = "$env:LLVM_PREFIX\bin;$env:PATH"
          cmake --build build --parallel

      - name: Run Integration Tests
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          $env:RUSTC_WRAPPER = "sccache"
          $env:PATH = "$env:DEV_DRIVE_WORKSPACE\build\bin;$env:LLVM_PREFIX\bin;$env:PATH"
          cmake --build build --target check

      - name: Package
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          $llvmMajor = (& "$env:LLVM_PREFIX\bin\llvm-config.exe" --version).Split('.')[0]
          $prefix = "reussir-nightly-$date-windows-x64-msvc-llvm$llvmMajor"
          New-Item -ItemType Directory -Force -Path "$prefix\bin", "$prefix\lib" | Out-Null

          foreach ($bin in @("reussir-opt", "reussir-translate", "rrc", "reussir-syntax", "rustc", "cargo", "rustdoc")) {
            Copy-Item "build\bin\$bin.exe" "$prefix\bin\" -ErrorAction SilentlyContinue
          }

          Copy-Item "build\bin\reussir_rt.dll" "$prefix\bin\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\MLIRReussirBridge*.dll" "$prefix\bin\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\LLVM*rust*.dll" "$prefix\bin\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\rustc_driver*.dll" "$prefix\bin\" -ErrorAction SilentlyContinue

          Copy-Item "$env:LLVM_PREFIX\bin\MLIR*.dll" "$prefix\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$env:LLVM_PREFIX\bin\LLVM*.dll" "$prefix\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$env:LLVM_PREFIX\bin\libMLIR*.dll" "$prefix\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$env:LLVM_PREFIX\bin\libLLVM*.dll" "$prefix\bin\" -ErrorAction SilentlyContinue

          Copy-Item "build\lib\rustlib" "$prefix\lib\" -Recurse -ErrorAction SilentlyContinue

          $strip = "$env:LLVM_PREFIX\bin\llvm-strip.exe"
          $stripInputs = @("$prefix\bin\reussir-opt.exe", "$prefix\bin\reussir-translate.exe") | Where-Object { Test-Path $_ }
          if ((Test-Path $strip) -and $stripInputs.Count -gt 0) {
            & $strip @stripInputs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "llvm-strip failed; continuing with unstripped binaries."
            }
          }

          7z a -tzip "$prefix.zip" $prefix
          $archivePath = (Resolve-Path "$prefix.zip").Path
          "ARCHIVE_NAME=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reussir-nightly-windows-x64
          path: ${{ env.ARCHIVE_NAME }}

  publish-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete existing nightly release
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force-tag nightly
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create or update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.tar.xz
            artifacts/*.zip
          body: |
            Automated nightly build from `${{ github.sha }}`.

            **Platforms:**
            - Linux x86_64 (LLVM 22)
            - Linux aarch64 (LLVM 22)
            - macOS ARM64 (Homebrew LLVM)
            - Windows x64 (MSVC LLVM via conda-forge)

            **Usage:** Extract the archive and add `<prefix>/bin` to `PATH`. Libraries are bundled with correct rpaths — no need to set `LD_LIBRARY_PATH`.
