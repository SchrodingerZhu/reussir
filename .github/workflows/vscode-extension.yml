name: VS Code Extension

# Runs from the Nix flake's vscode shell: the pinned Rust toolchain (with
# the wasm32-unknown-unknown std from rust-toolchain.toml), Node 24, and
# the wasm-bindgen CLI at the flake's version — the same lockstep pin the
# dev shell documents, so the CLI can never drift from the Cargo.toml
# wasm-bindgen pin the way an independently-installed binary could.
# scripts/build-wasm.mjs still verifies the match and fails fast.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vsix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Nix daemon gets the shared S3 bucket as a zstd binary cache for
      # what cache.nixos.org does not serve (the fenix Rust toolchain). Without
      # credentials — pull requests from forks — it stays on cache.nixos.org.
      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      # cargo's registry/git checkouts and the target dir, keyed on the lock
      # file and toolchain pin with a prefix fallback (what Swatinem/rust-cache
      # did through actions/cache), now snapshotted to the S3 bucket.
      - name: Restore cargo cache
        id: cache-cargo
        uses: ./.github/actions/s3-dir-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-vscode-${{ runner.os }}-${{ runner.arch }}-

      - name: Build dev shell
        run: nix develop .#vscode --command true

      - name: Push dev shell closure to Nix cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-push.sh vscode

      - name: Install extension dependencies
        run: nix develop .#vscode --command bash -c 'cd editors/vscode && npm ci'

      - name: Test Rust client codec
        run: nix develop .#vscode --command cargo test --locked --package reussir-vscode-wasm

      - name: Lint Rust client codec
        run: nix develop .#vscode --command cargo clippy --locked --package reussir-vscode-wasm --all-targets -- -D warnings

      - name: Build native language server
        run: nix develop .#vscode --command cargo build --locked --package reussir-lsp

      - name: Build extension and run protocol smoke test
        run: |
          nix develop .#vscode --command bash -c '
            cd editors/vscode
            npm run build
            npm run test:protocol
          '

      - name: Package VSIX
        env:
          REUSSIR_VSIX_OUT: ${{ github.workspace }}/reussir-vscode.vsix
        run: nix develop .#vscode --command bash -c 'cd editors/vscode && npm run package:vsix'

      - name: Inspect VSIX contents
        run: nix develop .#vscode --command bash -c 'cd editors/vscode && npx --no-install vsce ls --no-dependencies'

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: reussir-vscode
          path: reussir-vscode.vsix
          if-no-files-found: error

      - name: Save cargo cache
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
