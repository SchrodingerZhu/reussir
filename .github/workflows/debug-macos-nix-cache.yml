name: Debug macOS Nix S3 cache

# Manual diagnostic: the macOS dev shell fetch wedged with the S3 substituter
# configured while Linux was unaffected. Runs the same setup under timeouts,
# dumps daemon state (stack samples, open sockets, config) when it hangs,
# then repeats without the S3 store for comparison. Delete once resolved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        run: scripts/ci/nix-cache-probe.sh

      - name: Daemon and store facts
        run: |
          set -x
          nix --version
          nix config show | grep -E "substituters|trusted|timeout|http-connections|max-substitution-jobs" || true
          for f in /etc/nix/nix.conf /etc/nix/nix.custom.conf; do echo "== $f"; sudo cat "$f" 2>/dev/null || true; done
          sudo launchctl print system/systems.determinate.nix-daemon 2>/dev/null | grep -i -A8 "environment" || true
          sudo ls -la /var/root/.aws/ || true
          nix store info --store "$NIX_S3_STORE" || true
          nix path-info --store "$NIX_S3_STORE" --json nixpkgs#hello 2>&1 | head -c 600 || true

      - name: Timed dev shell fetch with the S3 store
        run: |
          with_timeout() { local secs=$1 pid wd rc; shift; "$@" & pid=$!; ( sleep "$secs"; kill "$pid" 2>/dev/null ) & wd=$!; wait "$pid"; rc=$?; kill "$wd" 2>/dev/null; wait "$wd" 2>/dev/null; return "$rc"; }
          dump() {
            echo "::group::daemon diagnostics ($1)"
            ps aux | grep -i "[n]ix" || true
            for pid in $(pgrep -f "nix-daemon" || true); do
              echo "== sample $pid"; sudo sample "$pid" 3 2>/dev/null | head -120 || true
              echo "== lsof $pid"; sudo lsof -nP -p "$pid" 2>/dev/null | grep -E "TCP|UDP" || true
            done
            sudo log show --last 10m --predicate 'process CONTAINS "nix"' --style compact 2>/dev/null | tail -60 || true
            echo "::endgroup::"
          }
          echo "--- dry run (substituter queries only)"
          if ! with_timeout 300 nix build --dry-run .#devShells.aarch64-darwin.default.inputDerivation; then
            echo "::warning::dry-run hung or failed with the S3 store"; dump dry-run
          fi
          echo "--- nix develop"
          start=$(date +%s)
          if with_timeout 600 nix develop --command true; then
            echo "nix develop with S3 store: OK in $(( $(date +%s) - start ))s"
          else
            echo "::warning::nix develop hung or failed with the S3 store after $(( $(date +%s) - start ))s"; dump develop
          fi

      - name: Same without the S3 store
        run: |
          with_timeout() { local secs=$1 pid wd rc; shift; "$@" & pid=$!; ( sleep "$secs"; kill "$pid" 2>/dev/null ) & wd=$!; wait "$pid"; rc=$?; kill "$wd" 2>/dev/null; wait "$wd" 2>/dev/null; return "$rc"; }
          for conf in /etc/nix/nix.conf /etc/nix/nix.custom.conf; do
            [ -e "$conf" ] && sudo sed -i.bak '/^extra-substituters = s3:/d' "$conf"
          done
          sudo launchctl kickstart -k system/systems.determinate.nix-daemon 2>/dev/null || sudo launchctl kickstart -k system/org.nixos.nix-daemon
          sleep 3
          nix config show | grep -E "^substituters" || true
          start=$(date +%s)
          if with_timeout 600 nix develop --command true; then
            echo "nix develop without S3 store: OK in $(( $(date +%s) - start ))s"
          else
            echo "::warning::nix develop hung or failed WITHOUT the S3 store after $(( $(date +%s) - start ))s"
            ps aux | grep -i "[n]ix" || true
          fi
