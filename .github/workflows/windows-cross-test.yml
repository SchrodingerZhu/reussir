name: Windows Cross (xwin + wine)

# Replaces the conda/MSVC full pipeline that ran on windows-2025 runners:
# the workspace default members (every LLVM-free crate, including all
# binaries the release ships except rrc/rrepl) are cross-compiled for
# x86_64-pc-windows-msvc with cargo-xwin from the flake's windows-cross
# shell, and their test suites execute under Wine — on a Linux runner,
# with the same pinned toolchain a developer gets from
# `nix develop .#windows-cross`.
#
# The `lit` job covers the full integration suite against the cross-built
# toolchain — including the polyffi and rene suites through the baked
# windows-native rustc/cargo running under Wine.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # sccache talks to the shared S3 bucket directly (no tarball round trip
      # through actions/cache), and the Nix daemon gets the same bucket as a
      # zstd binary cache for what cache.nixos.org does not serve (the fenix
      # Rust toolchain, the LLVM/MLIR join). Without credentials — pull
      # requests from forks — both fall back to local disk / cache.nixos.org.
      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          sccache-key-prefix: windows-cross

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      # cargo's registry/git checkouts and the target dir, keyed on the lock
      # file and toolchain pin with a prefix fallback (what Swatinem/rust-cache
      # did through actions/cache), now snapshotted to the S3 bucket.
      - name: Restore cargo cache
        id: cache-cargo
        uses: ./.github/actions/s3-dir-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-cross-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-windows-cross-test-${{ runner.os }}-${{ runner.arch }}-

      # The MSVC CRT + Windows SDK that cargo-xwin unpacks on first use
      # (~/.cache/cargo-xwin). Keyed manually: bump the suffix when the
      # workspace moves to a new xwin/SDK version.
      - name: Restore xwin CRT/SDK cache
        id: cache-xwin-crt-sdk
        uses: ./.github/actions/s3-dir-cache
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}-v2

      - name: Build dev shell
        run: nix develop .#windows-cross --command true

      - name: Push dev shell closure to Nix cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-push.sh windows-cross

      - name: Cross-build for x86_64-pc-windows-msvc
        run: nix develop .#windows-cross --command env RUSTC_WRAPPER=sccache cargo xwin build --target x86_64-pc-windows-msvc

      - name: Run test suites under Wine
        run: nix develop .#windows-cross --command env RUSTC_WRAPPER=sccache cargo xwin test --target x86_64-pc-windows-msvc

      - name: Save cargo cache
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-cross-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save xwin CRT/SDK cache
        if: steps.cache-xwin-crt-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}-v2

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: nix develop .#windows-cross --command sccache --show-stats

  # The lit integration suite against the cross-built toolchain. The whole
  # dependency graph — C++ dialect libs, rrc, rene, rrepl, the runtime —
  # cross-compiles through the cmake cargo plumbing
  # (REUSSIR_CARGO_BUILD_TARGET), and a binfmt_misc registration teaches the
  # kernel to run PE binaries through Wine, so both the staged tools and the
  # executables the tests produce execute transparently. Suites that need a
  # native host toolchain (rustc-driven polyffi/bake, sanitizers, debuggers,
  # wasm engines) report UNSUPPORTED, exactly as on any host missing those
  # features.
  lit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      # sccache talks to the shared S3 bucket directly (no tarball round trip
      # through actions/cache), and the Nix daemon gets the same bucket as a
      # zstd binary cache for what cache.nixos.org does not serve (the fenix
      # Rust toolchain, the LLVM/MLIR join). Without credentials — pull
      # requests from forks — both fall back to local disk / cache.nixos.org.
      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          sccache-key-prefix: windows-cross

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      # cargo's registry/git checkouts and the target dir, keyed on the lock
      # file and toolchain pin with a prefix fallback (what Swatinem/rust-cache
      # did through actions/cache), now snapshotted to the S3 bucket.
      - name: Restore cargo cache
        id: cache-cargo
        uses: ./.github/actions/s3-dir-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-cross-lit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-windows-cross-lit-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore xwin CRT/SDK cache
        id: cache-xwin-crt-sdk
        uses: ./.github/actions/s3-dir-cache
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}-v2

      - name: Restore conda MSVC LLVM cache
        id: cache-conda-msvc-llvm
        uses: ./.github/actions/s3-dir-cache
        with:
          path: ~/.cache/reussir-msvc-conda
          key: reussir-msvc-conda-llvm-23.1.0-v1

      # The windows-native rustc/cargo the reussir compilers spawn under
      # Wine (polyffi, rene's bake). Cached; keyed to the pinned nightly.
      - name: Restore windows rustc cache
        id: cache-windows-rustc
        uses: ./.github/actions/s3-dir-cache
        with:
          path: ~/.cache/reussir-msvc-rustc
          key: reussir-msvc-rustc-nightly-2026-08-31-v1

      - name: Build dev shell
        run: nix develop .#windows-cross --command true

      - name: Push dev shell closure to Nix cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-push.sh windows-cross

      - name: Bake conda MSVC LLVM/MLIR
        run: nix develop .#windows-cross --command reussir-bake-msvc-llvm

      - name: Bake windows rustc
        run: nix develop .#windows-cross --command reussir-bake-msvc-rustc

      # Teach the kernel to run PE executables through Wine, using the wine
      # binary from the windows-cross shell. F = resolve the interpreter at
      # registration time so it works from any mount namespace.
      - name: Register Wine binfmt
        run: |
          WINE=$(nix develop .#windows-cross --command sh -c 'command -v wine' | tail -1)
          echo "wine at $WINE"
          if [ ! -d /proc/sys/fs/binfmt_misc ]; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          echo ":DOSWin:M::MZ::$WINE:F" | sudo tee /proc/sys/fs/binfmt_misc/register
          # Prime the wine prefix outside the test run.
          nix develop .#windows-cross --command wine --version

      # xwin fetches the CRT/SDK on first cargo-xwin use; run the Rust-only
      # crates first so the splat exists before the cmake toolchain file
      # checks for it.
      - name: Populate xwin splat
        run: nix develop .#windows-cross --command cargo xwin build --locked --release --target x86_64-pc-windows-msvc -p reussir-syntax

      - name: Configure CMake
        run: |
          nix develop .#windows-cross --command bash -c '
            CONDA="$HOME/.cache/reussir-msvc-conda/Library"
            env -u NIX_STORE RUSTC_WRAPPER=sccache cmake -B build-xwin -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-to-windows-msvc.cmake \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DREUSSIR_ENABLE_TESTS=ON \
              -DREUSSIR_CARGO_BUILD_TARGET=x86_64-pc-windows-msvc \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DCMAKE_PREFIX_PATH="$CONDA" \
              -DLLVM_DIR="$CONDA/lib/cmake/llvm" \
              -DMLIR_DIR="$CONDA/lib/cmake/mlir"
          '

      - name: Build toolchain
        run: |
          nix develop .#windows-cross --command bash -c '
            env RUSTC_WRAPPER=sccache cmake --build build-xwin --parallel --target all
          '

      # The runtime tree the polyffi/rene suites resolve against must be
      # built by the windows toolchain itself so its proc macros are
      # windows DLLs; the host cargo fetch shares its cache through the
      # unix CARGO_HOME the shell exports.
      - name: Build Wine runtime tree
        run: |
          nix develop .#windows-cross --command bash -c '
            cargo fetch --locked
            CARGO_TARGET_DIR="$PWD/build-xwin/target-rt-wine" CARGO_NET_OFFLINE=true \
              wine "$REUSSIR_MSVC_RUSTC_PREFIX/bin/cargo.exe" build --offline --locked --release -p reussir-rt
          '

      - name: Run lit suite under Wine
        run: |
          nix develop .#windows-cross --command bash -c '
            env RUSTC_WRAPPER=sccache cmake --build build-xwin --target check
          '

      - name: Save cargo cache
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-cross-lit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save xwin CRT/SDK cache
        if: steps.cache-xwin-crt-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}-v2

      - name: Save conda MSVC LLVM cache
        if: steps.cache-conda-msvc-llvm.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: ~/.cache/reussir-msvc-conda
          key: reussir-msvc-conda-llvm-23.1.0-v1

      - name: Save windows rustc cache
        if: steps.cache-windows-rustc.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: ~/.cache/reussir-msvc-rustc
          key: reussir-msvc-rustc-nightly-2026-08-31-v1

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: nix develop .#windows-cross --command sccache --show-stats
