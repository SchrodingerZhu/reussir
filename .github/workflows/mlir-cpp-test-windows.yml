name: MinGW Clang64 Full Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dev Drive
        uses: samypr100/setup-dev-drive@v3
        with:
          drive-size: 8GB
          workspace-copy: true
          trusted-dev-drive: true

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2
        with:
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

      - name: Install vcredist140
        shell: pwsh
        run: |
          choco install vcredist140 -y

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-mlir
            mingw-w64-clang-x86_64-spdlog
            mingw-w64-clang-x86_64-gtest
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-python-pip
            mingw-w64-clang-x86_64-rustup

      - name: Install Rust and Python dependencies
        shell: msys2 {0}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          pip install lit
          # The repo-root rust-toolchain.toml pins only a bare `channel`, which
          # rustup resolves against the default host triple. On this clang64
          # image that default is the MSVC host, so the runtime would build as
          # x86_64-pc-windows-msvc and emit /DEFAULTLIB:oldnames directives that
          # the gnu clang linker used by the integration tests cannot satisfy
          # (ld.lld: could not open 'libOLDNAMES.a'). Pin the default host to
          # gnullvm so the bare channel resolves to the gnu/LLVM toolchain.
          rustup set default-host x86_64-pc-windows-gnullvm
          rustup target add x86_64-pc-windows-gnullvm
          rustup default nightly-2026-02-15-x86_64-pc-windows-gnullvm
          rustup component add rust-src rustfmt clippy
          rustc -vV

      - name: Configure CMake
        shell: msys2 {0}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DREUSSIR_ENABLE_PEDANTIC=ON \
          -DREUSSIR_ENABLE_TESTS=ON

      - name: Build
        shell: msys2 {0}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cmake --build build --parallel


      - name: Run Integration Tests
        shell: msys2 {0}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          export GITHUB_WORKSPACE=$(cygpath "$DEV_DRIVE_WORKSPACE")
          . .github/workflows/setup_path.sh
          cmake --build build --target check
