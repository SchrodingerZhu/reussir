channels:
  - conda-forge
dependencies:
  - python=3.12
  - cmake
  - ninja
  - lit
  # lit's --timeout (set via LIT_OPTS in the workflow) needs psutil to
  # reap wedged test processes.
  - psutil
  - clangxx=22.1.8
  - compiler-rt=22.1.8
  - llvmdev=22.1.8
  - llvm-tools=22.1.8
  - mlir=22.1.8
  - gtest
  - spdlog
  - zlib
  - zstd
  - libxml2
  - pip
  - pip:
      - filecheck==1.0.3
